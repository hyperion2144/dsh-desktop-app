name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 官方 pnpm 安装 action；version 与 desktop/pnpm-lock.yaml 的 lockfileVersion 9.0 匹配。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # cache: pnpm 由 setup-node 负责安装依赖并缓存 pnpm store（跨平台路径自动处理），
      # 不再需要手动 npm install -g pnpm / actions/cache。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # tauri-action 会先按 desktop/pnpm-lock.yaml 安装依赖，再用 desktop 的
      # @tauri-apps/cli（npm CLI，devDependency）执行 tauri build —— 无需 cargo install tauri-cli。
      - name: Build & upload to release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Deepseek Harness ${{ github.ref_name }}"
          releaseBody: |
            Tauri 2 desktop client for DeepSeek Harness.

            - **macOS** (Apple Silicon): `Deepseek Harness.app` + `.dmg`
            - **Windows** (x86_64): `.msi` (WiX) + `-setup.exe` (NSIS)
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
